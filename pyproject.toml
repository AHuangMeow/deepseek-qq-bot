[project]
name = "deepseek-qq-bot"
version = "0.1.0"
description = "NapCat + Kev + DeepSeek QQ bot with local reply-decision routing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AHuangMeow" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.1.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
